blueprint:
  name: PATLITE Signal Tower HTTP Control
  description: Control PATLITE signal towers over HTTP
  domain: script

  input:
    patlite_ip:
      name: PATLITE IP
      default: 192.168.10.1
      selector:
        text:

    red:
      name: Red
      default: "0"
      selector:
        select:
          options:
            - label: Off
              value: "0"
            - label: Solid
              value: "1"
            - label: Blink 1
              value: "2"
            - label: Blink 2
              value: "3"
            - label: No Change
              value: "9"

    yellow:
      name: Yellow
      default: "0"
      selector:
        select:
          options:
            - label: Off
              value: "0"
            - label: Solid
              value: "1"
            - label: Blink 1
              value: "2"
            - label: Blink 2
              value: "3"
            - label: No Change
              value: "9"

    green:
      name: Green
      default: "0"
      selector:
        select:
          options:
            - label: Off
              value: "0"
            - label: Solid
              value: "1"
            - label: Blink 1
              value: "2"
            - label: Blink 2
              value: "3"
            - label: No Change
              value: "9"

    blue:
      name: Blue
      default: "0"
      selector:
        select:
          options:
            - label: Off
              value: "0"
            - label: Solid
              value: "1"
            - label: Blink 1
              value: "2"
            - label: Blink 2
              value: "3"
            - label: No Change
              value: "9"

    white:
      name: White
      default: "0"
      selector:
        select:
          options:
            - label: Off
              value: "0"
            - label: Solid
              value: "1"
            - label: Blink 1
              value: "2"
            - label: Blink 2
              value: "3"
            - label: No Change
              value: "9"

    buzzer:
      name: Buzzer
      default: "0"
      selector:
        select:
          options:
            - label: Off
              value: "0"
            - label: Pattern 1
              value: "1"
            - label: Pattern 2
              value: "2"
            - label: Pattern 3
              value: "3"
            - label: Pattern 4
              value: "4"
            - label: No Change
              value: "9"

    auto_stop_buzzer:
      name: Auto Stop Buzzer
      default: true
      selector:
        boolean:

    buzzer_stop_seconds:
      name: Buzzer Stop Seconds
      default: 3
      selector:
        number:
          min: 0
          max: 300
          step: 1
          mode: slider
          unit_of_measurement: seconds

sequence:
  - variables:
      alert_value: >
        {{ red ~ yellow ~ green ~ blue ~ white ~ buzzer }}

  - action: http.request
    data:
      method: GET
      url: >
        http://{{ patlite_ip }}/api/control?alert={{ alert_value }}

  - if:
      - condition: template
        value_template: >
          {{ auto_stop_buzzer and buzzer != '0' and buzzer != '9' and buzzer_stop_seconds | int > 0 }}
    then:
      - delay:
          seconds: "{{ buzzer_stop_seconds | int }}"

      - action: http.request
        data:
          method: GET
          url: >
            http://{{ patlite_ip }}/api/control?alert=999990

mode: restart
