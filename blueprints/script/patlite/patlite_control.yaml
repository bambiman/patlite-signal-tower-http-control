blueprint:
  name: PATLITE Signal Tower HTTP Control
  description: Control PATLITE signal towers over HTTP.
  domain: script
  source_url: https://github.com/bambiman/patlite-signal-tower-http-control/blob/main/blueprints/script/bambiman/patlite_control.yaml

  input:
    patlite_ip:
      name: PATLITE IP
      description: PATLITE IP address.
      default: "192.168.10.1"
      selector:
        text: {}

    red:
      name: Red
      default: "0"
      selector:
        select:
          options:
            - label: "Off"
              value: "0"
            - label: "Solid"
              value: "1"
            - label: "Blink 1"
              value: "2"
            - label: "Blink 2"
              value: "3"
            - label: "No Change"
              value: "9"
          mode: dropdown

    yellow:
      name: Yellow
      default: "0"
      selector:
        select:
          options:
            - label: "Off"
              value: "0"
            - label: "Solid"
              value: "1"
            - label: "Blink 1"
              value: "2"
            - label: "Blink 2"
              value: "3"
            - label: "No Change"
              value: "9"
          mode: dropdown

    green:
      name: Green
      default: "0"
      selector:
        select:
          options:
            - label: "Off"
              value: "0"
            - label: "Solid"
              value: "1"
            - label: "Blink 1"
              value: "2"
            - label: "Blink 2"
              value: "3"
            - label: "No Change"
              value: "9"
          mode: dropdown

    blue:
      name: Blue
      default: "0"
      selector:
        select:
          options:
            - label: "Off"
              value: "0"
            - label: "Solid"
              value: "1"
            - label: "Blink 1"
              value: "2"
            - label: "Blink 2"
              value: "3"
            - label: "No Change"
              value: "9"
          mode: dropdown

    white:
      name: White
      default: "0"
      selector:
        select:
          options:
            - label: "Off"
              value: "0"
            - label: "Solid"
              value: "1"
            - label: "Blink 1"
              value: "2"
            - label: "Blink 2"
              value: "3"
            - label: "No Change"
              value: "9"
          mode: dropdown

    buzzer:
      name: Buzzer
      default: "0"
      selector:
        select:
          options:
            - label: "Off"
              value: "0"
            - label: "Pattern 1"
              value: "1"
            - label: "Pattern 2"
              value: "2"
            - label: "Pattern 3"
              value: "3"
            - label: "Pattern 4"
              value: "4"
            - label: "No Change"
              value: "9"
          mode: dropdown

    auto_stop_buzzer:
      name: Auto Stop Buzzer
      description: Stop only the buzzer after the specified seconds.
      default: true
      selector:
        boolean: {}

    buzzer_stop_seconds:
      name: Buzzer Stop Seconds
      description: Seconds before stopping only the buzzer.
      default: 3
      selector:
        number:
          min: 0
          max: 300
          step: 1
          mode: slider
          unit_of_measurement: seconds

sequence:
  - variables:
      patlite_ip_value: !input patlite_ip
      red_value: !input red
      yellow_value: !input yellow
      green_value: !input green
      blue_value: !input blue
      white_value: !input white
      buzzer_value: !input buzzer
      auto_stop_buzzer_value: !input auto_stop_buzzer
      buzzer_stop_seconds_value: !input buzzer_stop_seconds
      alert_value: >
        {{ red_value ~ yellow_value ~ green_value ~ blue_value ~ white_value ~ buzzer_value }}

  - action: http.request
    data:
      method: GET
      url: >
        http://{{ patlite_ip_value }}/api/control?alert={{ alert_value }}

  - if:
      - condition: template
        value_template: >
          {{ auto_stop_buzzer_value
             and buzzer_value != '0'
             and buzzer_value != '9'
             and (buzzer_stop_seconds_value | int > 0) }}
    then:
      - delay:
          seconds: "{{ buzzer_stop_seconds_value | int }}"

      - action: http.request
        data:
          method: GET
          url: >
            http://{{ patlite_ip_value }}/api/control?alert=999990

mode: restart
